<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distribuili Van</title>
<script src="./js/jsQR.js"></script>
<style>
body{font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
.card{background:#1e293b;border-radius:16px;padding:28px;max-width:420px;width:92%;box-shadow:0 10px 40px #0008;text-align:center}
h1{font-size:18px;margin:0 0 6px}.logo{font-size:40px}
p{font-size:13px;opacity:.7;margin:0 0 14px;line-height:1.8}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#0d59a3;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
button.ghost{background:transparent;border:1px solid #334155;font-size:14px;font-weight:600}
.hint{font-size:12px;opacity:.6;margin-top:10px}
video{width:100%;border-radius:12px;background:#000;max-height:46vh;object-fit:cover}
.hidden{display:none}
.err{color:#f87171;font-size:13px;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<!-- returning user: brief splash, then straight into the app -->
<div class="card" id="loading" style="display:none">
  <div class="logo">🚚</div>
  <h1>جارٍ الفتح…</h1>
  <p>يتم فتح تطبيق التوزيع الخاص بك</p>
</div>

<!-- first run: scan only — no address is ever typed or shown -->
<div class="card" id="setup" style="display:none">
  <div id="serverView">
    <div class="logo">🚚</div>
    <h1>الاتصال بخادم التوزيع</h1>
    <p>امسح رمز الاتصال المشترك الظاهر في صفحة الأجهزة على الكمبيوتر.</p>
    <button id="scanBtn" onclick="startScan()">📷 مسح الرمز</button>
    <video id="cam" class="hidden" playsinline muted></video>
    <button id="stopBtn" class="ghost hidden" onclick="stopScan()">إيقاف</button>
    <div class="err" id="scanErr"></div>
    <div class="hint">أو اختر صورة الرمز من المعرض:</div>
    <input type="file" id="gallery" accept="image/*" style="margin-top:8px">
    <div class="err" id="err"></div>
  </div>
</div>

<script>
var KEY = "dili_apk_server";
var TKEY = "dili_apk_token";
var timer = null, stream = null, scanning = false, scanTimer = 0;

function saved() {
  try { return { url: localStorage.getItem(KEY) || "", token: localStorage.getItem(TKEY) || "" }; }
  catch (e) { return { url: "", token: "" }; }
}
/// Server base URL. Accepts a bare origin AND legacy setup payloads that
/// carry the full `/api/sync` endpoint (old QRs) — both resolve to the origin.
/// The value is stored but NEVER displayed to the driver.
function baseOf(url) {
  var u = String(url || "").trim().replace(/\/+$/, "");
  var i = u.indexOf("/api/sync");
  if (i > 0) u = u.slice(0, i).replace(/\/+$/, "");
  return u;
}
/// Day slug mirror of the server's daySlug(): yyyy-m-d, NOT zero-padded
/// (`2026-10-8`). Must match exactly or the offline entry 404s.
function todaySlug() {
  var d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
/// THE entry, online and offline: today's dashboard, warmed on every visit
/// and served by the service worker with zero connection. No probe, no
/// server-redirect hop, no day picker — one path, zero taps, always.
function dashboardUrl(url, token) {
  var dest = baseOf(url) + "/ar/livreur/" + todaySlug() + "/dashboard";
  if (token) dest += "?device=" + encodeURIComponent(token);
  return dest;
}
function connect(url, token) {
  url = baseOf(url);
  if (!url) { showSetup(); return; }
  try {
    localStorage.setItem(KEY, url);
    if (token) localStorage.setItem(TKEY, token);
  } catch (e) {}
  document.getElementById("setup").style.display = "none";
  document.getElementById("loading").style.display = "";
  if (timer) clearTimeout(timer);
  timer = setTimeout(function () { window.location.href = dashboardUrl(url, token); }, 300);
}

/* ---- QR scan (camera + gallery), decoded on-device, no network ---- */
function parsePayload(text) {
  text = (text || "").trim();
  try {
    var d = JSON.parse(text);
    if (d && d.app === "distribuili" && d.type === "device-setup" && d.url && d.token)
      return { url: String(d.url), token: String(d.token) };
    if (d && d.url) return { url: String(d.url), token: d.token ? String(d.token) : "" };
  } catch (e) {}
  if (/^https?:\/\//i.test(text)) return { url: text, token: "" };
  if (/^[0-9a-f]{32,128}$/i.test(text)) {
    var s = saved();
    if (s.url) return { url: s.url, token: text };
  }
  return null;
}
async function onCode(text) {
  var p = parsePayload(text);
  if (!p) {
    document.getElementById("scanErr").textContent = "رمز غير صالح — حاول مجدداً";
    return;
  }
  stopScan();
  connect(p.url, p.token);
}
function decodeFrame(video, canvas) {
  try {
    var w = video.videoWidth, h = video.videoHeight;
    if (!w || !h || typeof jsQR === "undefined") return;
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, w, h);
    var data = ctx.getImageData(0, 0, w, h);
    var hit = jsQR(data.data, w, h);
    if (hit && hit.data) onCode(hit.data);
  } catch (e) {}
}
async function startScan() {
  document.getElementById("scanErr").textContent = "";
  var video = document.getElementById("cam");
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw 0;
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  } catch (e) {
    document.getElementById("scanErr").textContent = "تعذّر فتح الكاميرا — اسمح بالكاميرا أو استعمل المعرض";
    return;
  }
  video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  video.classList.remove("hidden");
  document.getElementById("scanBtn").classList.add("hidden");
  document.getElementById("stopBtn").classList.remove("hidden");
  scanning = true;
  var canvas = document.createElement("canvas");
  (function tick() {
    if (!scanning) return;
    decodeFrame(video, canvas);
    scanTimer = setTimeout(tick, 350);
  })();
}
function stopScan() {
  scanning = false;
  clearTimeout(scanTimer);
  try {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
  } catch (e) {}
  stream = null;
  var video = document.getElementById("cam");
  if (video) {
    video.classList.add("hidden");
    video.srcObject = null;
  }
  var sb = document.getElementById("scanBtn");
  if (sb) sb.classList.remove("hidden");
  var tb = document.getElementById("stopBtn");
  if (tb) tb.classList.add("hidden");
}
document.getElementById("gallery").addEventListener("change", function (e) {
  var f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f || typeof jsQR === "undefined") return;
  var img = new Image();
  img.onload = function () {
    try {
      var c = document.createElement("canvas");
      var sc = Math.min(1, 1280 / Math.max(img.width, img.height));
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      var ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, c.width, c.height);
      var hit = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height);
      if (hit && hit.data) onCode(hit.data);
      else document.getElementById("scanErr").textContent = "لا يوجد رمز في هذه الصورة";
    } catch (err) {}
    try { URL.revokeObjectURL(img.src); } catch (err) {}
  };
  img.src = URL.createObjectURL(f);
});

(function init() {
  var s = saved();
  // Connectivity returning mid-splash: enter immediately.
  window.addEventListener("online", function () {
    try {
      var cur = saved();
      if (document.getElementById("loading").style.display !== "none" && cur.url) connect(cur.url, cur.token);
    } catch (e) {}
  });
  if (s.url) {
    document.getElementById("loading").style.display = "";
    connect(s.url, s.token);
  } else {
    document.getElementById("setup").style.display = "";
  }
})();
</script>
</body>
</html>
