# Install in /etc/nginx/conf.d/. Query strings and request/response bodies
# are deliberately excluded: they contain machine IDs, keys, and tokens.
log_format distribuili_license escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"upstream_status":"$upstream_status","duration":$request_time,'
    '"cf_ray":"$http_cf_ray"}';
