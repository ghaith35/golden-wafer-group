appId: com.distribuili.app.local
productName: Distribuili Local
npmRebuild: false
directories:
  output: dist-electron
files:
  - electron/dist/**/*
  - package.json
  # Build-time-only native compilers — the shipped standalone Next server never
  # runs them (compilation happened at build time).
  - "!node_modules/@next/swc-*/**"
  - "!node_modules/@swc/core-*/**"
  # The Next standalone server is self-contained (runtime deps traced into
  # .next/standalone/node_modules). Drop the redundant full copies.
  - "!node_modules/next/**"
  - "!node_modules/@prisma/**"
  - "!node_modules/.prisma/**"

# The Next.js standalone server + offline-DB resources ship as
# resources/app/.next/standalone (matches the packaged path in electron/main.ts)
# — OUTSIDE the asar archive so plain-Node require resolution works.
extraResources:
  - from: .next/standalone
    to: app/.next/standalone
  # electron-builder skips a copy source's root node_modules, so copy it as its
  # own `from` root (children are never the literal "node_modules").
  - from: .next/standalone/node_modules
    to: app/.next/standalone/node_modules
  - from: build-mode.json
    to: build-mode.json
  # Pre-seeded DB (built by scripts/build-sqlite-seed.mjs) — copied on first
  # run so the offline app ships ready to log in.
  - from: prisma/sqlite-seed.db
    to: app/.next/standalone/prisma/sqlite-seed.db
  # Per-client stage (build/stage/): build-client.json identity + bundled
  # cloudflared connector (bin/cloudflared[.exe]). Staged by
  # scripts/dist-client.mjs (client builds) or defaulted by
  # scripts/electron-prepare.mjs (generic builds: identity only, no tunnel).
  - from: build/stage
    to: client

asar: true
# Native modules can't load from inside an asar — unpack the SQLite driver
# the MAIN process opens the DB with.
asarUnpack:
  - "node_modules/libsql/**"
  - "node_modules/@libsql/**"

mac:
  target: dmg
  category: public.app-category.business
  icon: build/icon.icns
dmg:
  # Space-free names (repaire parity): the default "Distribuili Local …" names
  # break URLs and the generic-provider update feed.
  artifactName: Distribuili-Local-${version}-${arch}.${ext}
win:
  icon: build/icon.ico
  target: [nsis]
  # ── Code signing (THE fix for "stopped and removed by Windows 11") ──────
  # An unsigned NSIS .exe from an unknown publisher + obfuscated JS + bundled
  # cloudflared + Winlogon writes = Defender SmartScreen/PUA quarantine.
  # Sign every shipped .exe:
  #   1. Buy an OV (or EV) code-signing certificate (e.g. SSL.com, DigiCert).
  #   2. Export as .pfx, then build with:
  #        CSC_LINK=/path/cert.pfx CSC_KEY_PASSWORD='…' \
  #        CSC_TIMESTAMP_SERVER=http://timestamp.digicert.com \
  #        npm run dist:client:win
  #   electron-builder picks CSC_LINK/CSC_KEY_PASSWORD automatically; the
  #   timestamp server keeps the signature valid after cert expiry.
  #   3. After the FIRST signed release, submit the .exe to
  #      https://www.microsoft.com/en-us/wdsi/filesubmission  (Software
  #      Developer → "I believe this file is incorrectly detected") so
  #      Defender builds reputation for your publisher. Until reputation is
  #      established, SmartScreen still shows ONE blue "Unknown publisher"
  #      prompt — that is expected and NOT a quarantine.
  #   4. Ship this exact signed binary to customers (re-uploading a
  #      byte-different copy resets SmartScreen reputation).
  requestedExecutionLevel: highestAvailable
nsis:
  oneClick: false
  # Machine install: Windows shows the admin (UAC) prompt automatically,
  # so the always-on setup below can run without extra steps.
  perMachine: true
  allowToChangeInstallationDirectory: true
  differentialPackage: true
  artifactName: Distribuili-Local-Setup-${version}.${ext}
  # "App already running — close it?" guard (prevents installs stalling on
  # locked files mid-extraction).
  include: build/installer.nsh
  # Never wipe the shop data (SQLite DB + backups in %APPDATA%) on uninstall.
  deleteAppDataOnUninstall: false
publish:
  provider: generic
  url: https://distribuili.khiatadz.com/updates/local
  channel: latest
