<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribuili — Theme Gallery (24 themes)</title>
<style>
  :root {
    --bg-surface: #fafbf9; --bg-sunken: #f1f5f4; --bg-overlay: #ffffff;
    --text-primary: #0b1f17; --text-secondary: #4b5b53;
    --border-default: #e2e8e6; --brand-500: #10b981; --brand-600: #059669;
    --gradient-brand: linear-gradient(135deg, #10b981, #047857);
    --semantic-success: #10b981; --semantic-danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg-surface); color: var(--text-primary); font-family: system-ui, "Segoe UI", Tahoma, sans-serif; transition: background .25s, color .25s; }
  header { position: sticky; top: 0; z-index: 20; background: var(--bg-overlay); border-bottom: 1px solid var(--border-default); padding: 12px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; font-weight: 900; }
  header .sub { font-size: 12px; color: var(--text-secondary); }
  header input { height: 38px; border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-primary); border-radius: 10px; padding: 0 12px; font-size: 14px; min-width: 200px; }
  header button { height: 38px; border: none; border-radius: 10px; padding: 0 16px; font-weight: 800; font-size: 13px; cursor: pointer; background: var(--bg-sunken); color: var(--text-primary); }
  header button.primary { background: var(--gradient-brand); color: #fff; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--bg-overlay); border: 1px solid var(--border-default); border-radius: 16px; overflow: hidden; }
  .card.active { outline: 3px solid var(--brand-500); }
  .mock { display: flex; min-height: 150px; }
  .mock .side { width: 74px; padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; }
  .mock .side i { display: block; height: 10px; border-radius: 5px; background: currentColor; opacity: .35; }
  .mock .side i.on { opacity: 1; }
  .mock .main { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .mock .row { display: flex; gap: 6px; }
  .mock .pill { height: 22px; border-radius: 6px; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 10px; }
  .mock .line { height: 8px; border-radius: 4px; }
  .mock .dots { display: flex; gap: 6px; align-items: center; }
  .mock .dot { width: 12px; height: 12px; border-radius: 50%; }
  .info { padding: 12px 14px; border-top: 1px solid var(--border-default); }
  .info h2 { font-size: 15px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; }
  .info h2 small { font-weight: 600; opacity: .55; font-size: 11px; }
  .swatches { display: flex; gap: 4px; margin: 8px 0; }
  .swatches span { flex: 1; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.08); }
  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; height: 34px; border-radius: 9px; font-size: 12px; font-weight: 800; cursor: pointer; border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-primary); }
  .actions button.go { background: var(--gradient-brand); color: #fff; border: none; }
  #preview { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; background: var(--bg-surface); color: var(--text-primary); }
  #preview.open { display: flex; }
  #preview .bar { display: flex; gap: 10px; align-items: center; padding: 12px 20px; background: var(--bg-overlay); border-bottom: 1px solid var(--border-default); flex-wrap: wrap; }
  #preview .bar h2 { font-size: 16px; font-weight: 900; margin-inline-end: auto; }
  #preview .bar button { height: 36px; border-radius: 9px; padding: 0 14px; font-weight: 800; font-size: 13px; cursor: pointer; border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-primary); }
  #preview .bar button.go { background: var(--gradient-brand); color: #fff; border: none; }
  #preview .demo { flex: 1; overflow: auto; padding: 24px; max-width: 900px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .demo .shell { display: flex; gap: 0; border: 1px solid var(--border-default); border-radius: 14px; overflow: hidden; min-height: 300px; background: var(--bg-overlay); }
  .demo .dside { width: 150px; padding: 14px 10px; display: flex; flex-direction: column; gap: 8px; }
  .demo .dmain { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .demo .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .demo .kpi { border-radius: 10px; padding: 10px; }
  #toast { position: fixed; bottom: 24px; inset-inline: 0; margin: 0 auto; width: fit-content; background: #0b1f17; color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 700; display: none; z-index: 99; }
</style>
</head>
<body>
<header>
  <div><h1>🎨 Theme Gallery</h1><div class="sub" id="count"></div></div>
  <input id="q" placeholder="Search themes… بحث">
  <button id="modeBtn">🌙 Dark preview</button>
  <button id="resetBtn">Reset to Lime</button>
</header>
<main><div class="grid" id="grid"></div></main>

<div id="preview">
  <div class="bar">
    <h2 id="pvName"></h2>
    <button id="pvCopy">Copy CSS</button>
    <button id="pvApply" class="go">✓ Apply to app</button>
    <button id="pvClose">✕ Close</button>
  </div>
  <div class="demo" id="pvDemo"></div>
</div>
<div id="toast"></div>

<script>
const TOKENS = ["surface","sunken","overlay","ink","muted","border","brand","brand600","grad","success","danger"];
let THEMES = [];
let current = localStorage.getItem("distribuili-theme-name") || "lime";
let darkPreview = false;

const $ = (s) => document.querySelector(s);
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2200); }
function vars(t) {
  const v = {};
  TOKENS.forEach((k, i) => v[k] = t.tokens[i]);
  return v;
}
function applyVars(v, root) {
  const r = root || document.documentElement;
  r.style.setProperty("--bg-surface", v.surface);
  r.style.setProperty("--bg-sunken", v.sunken);
  r.style.setProperty("--bg-overlay", v.overlay);
  r.style.setProperty("--text-primary", v.ink);
  r.style.setProperty("--text-secondary", v.muted);
  r.style.setProperty("--border-default", v.border);
  r.style.setProperty("--brand-500", v.brand);
  r.style.setProperty("--brand-600", v.brand600);
  r.style.setProperty("--gradient-brand", `linear-gradient(135deg, ${v.brand}, ${v.grad})`);
  r.style.setProperty("--semantic-success", v.success);
  r.style.setProperty("--semantic-danger", v.danger);
}
function cssBlock(t) {
  const v = vars(t);
  return `[data-theme="${t.id}"] {\n  --bg-surface: ${v.surface};\n  --bg-sunken: ${v.sunken};\n  --bg-overlay: ${v.overlay};\n  --text-primary: ${v.ink};\n  --text-secondary: ${v.muted};\n  --border-default: ${v.border};\n  --brand-500: ${v.brand};\n  --brand-600: ${v.brand600};\n  --gradient-brand: linear-gradient(135deg, ${v.brand}, ${v.grad});\n  --semantic-success: ${v.success};\n  --semantic-danger: ${v.danger};\n}`;
}

function mockHTML(v, name) {
  return `<div class="mock">
    <div class="side" style="background:${v.sunken};color:${v.brand}">
      <i class="on"></i><i></i><i></i><i></i><i></i><i style="margin-top:auto"></i>
    </div>
    <div class="main" style="background:${v.overlay}">
      <div class="row"><span class="pill" style="background:linear-gradient(135deg,${v.brand},${v.grad});color:#fff">Sell · بيع</span><span class="pill" style="background:${v.sunken};color:${v.ink}">Cancel</span></div>
      <div class="line" style="background:${v.sunken};width:90%"></div>
      <div class="line" style="background:${v.sunken};width:65%"></div>
      <div class="dots"><span class="dot" style="background:${v.success}"></span><span class="dot" style="background:${v.danger}"></span><span class="dot" style="background:${v.brand}"></span><span style="font-size:10px;color:${v.muted}">1,250 DZD · ${name}</span></div>
    </div>
  </div>`;
}

function render(filter) {
  const grid = $("#grid");
  grid.innerHTML = "";
  const list = THEMES.filter(t => !filter || t.name.toLowerCase().includes(filter) || (t.ar||"").includes(filter));
  $("#count").textContent = list.length + " themes · اختر المظهر الذي يعجبك";
  list.forEach(t => {
    const v = vars(t);
    const el = document.createElement("div");
    el.className = "card" + (t.id === current ? " active" : "");
    el.innerHTML = mockHTML(v, t.name) +
      `<div class="info" style="background:${v.overlay};color:${v.ink};border-color:${v.border}">
        <h2>${t.name} <small>${t.ar || ""} ${t.id === current ? "· ✓ active" : ""}</small></h2>
        <div class="swatches">${t.tokens.slice(0, 8).map(c => `<span style="background:${c}"></span>`).join("")}</div>
        <div class="actions">
          <button data-a="preview">👁 Preview</button>
          <button data-a="copy">Copy CSS</button>
          <button data-a="apply" class="go">✓ Use</button>
        </div>
      </div>`;
    el.querySelectorAll("button").forEach(b => b.onclick = (e) => { e.stopPropagation(); act(t, b.dataset.a); });
    el.onclick = () => act(t, "preview");
    grid.appendChild(el);
  });
}

function act(t, a) {
  if (a === "preview") openPreview(t);
  if (a === "copy") navigator.clipboard.writeText(cssBlock(t)).then(() => toast("CSS copied ✓"));
  if (a === "apply") {
    localStorage.setItem("distribuili-theme-name", t.id);
    current = t.id;
    render($("#q").value.trim().toLowerCase());
    toast(`✓ ${t.name} applied — open the app to see it`);
  }
}

function openPreview(t) {
  const v = vars(t);
  applyVars(v);
  document.body.style.background = v.surface;
  document.body.style.color = v.ink;
  $("#pvName").textContent = `${t.name} ${t.ar ? "· " + t.ar : ""}`;
  $("#pvDemo").innerHTML = `
    <div class="shell">
      <div class="dside" style="background:${v.sunken}">
        <div style="font-weight:900">Distribuili</div>
        ${["Dashboard", "Clients", "Stock", "Sales"].map((x, i) => `<div style="padding:8px 10px;border-radius:8px;font-size:13px;font-weight:700;${i === 3 ? `background:${v.brand}22;color:${v.brand}` : `color:${v.muted}`}">${x}</div>`).join("")}
      </div>
      <div class="dmain" style="background:${v.overlay}">
        <h3>Today sales · مبيعات اليوم</h3>
        <div class="kpis">
          ${[["Sales", "12,400"], ["Margin", "3,100"], ["Debts", "8,900"]].map(([k, val]) => `<div class="kpi" style="background:${v.surface};border:1px solid ${v.border}"><div style="font-size:10px;color:${v.muted}">${k}</div><div style="font-weight:900">${val}</div></div>`).join("")}
        </div>
        <div style="display:flex;gap:8px">
          <span class="pill" style="background:linear-gradient(135deg,${v.brand},${v.grad});color:#fff;padding:8px 18px">+ New sale</span>
          <span class="pill" style="background:${v.sunken};color:${v.ink};padding:8px 18px">Print BL</span>
        </div>
        <div class="line" style="background:${v.sunken};height:10px"></div>
        <div class="line" style="background:${v.sunken};height:10px;width:70%"></div>
      </div>
    </div>
    <div class="swatches">${t.tokens.map(c => `<span style="background:${c};height:30px"></span>`).join("")}</div>`;
  $("#preview").classList.add("open");
  $("#pvApply").onclick = () => act(t, "apply");
  $("#pvCopy").onclick = () => act(t, "copy");
  $("#pvClose").onclick = closePreview;
}
function closePreview() {
  $("#preview").classList.remove("open");
  const cur = THEMES.find(t => t.id === current) || THEMES[0];
  if (cur) { applyVars(vars(cur)); document.body.style.background = vars(cur).surface; document.body.style.color = vars(cur).ink; }
}

$("#q").oninput = (e) => render(e.target.value.trim().toLowerCase());
$("#modeBtn").onclick = (e) => {
  darkPreview = !darkPreview;
  e.target.textContent = darkPreview ? "☀️ Light preview" : "🌙 Dark preview";
  document.body.style.filter = darkPreview ? "invert(0.92) hue-rotate(180deg)" : "";
};
$("#resetBtn").onclick = () => act(THEMES.find(t => t.id === "lime"), "apply");

fetch("themes.json").then(r => r.json()).then(d => {
  THEMES = d.themes;
  const cur = THEMES.find(t => t.id === current);
  if (cur) { applyVars(vars(cur)); document.body.style.background = vars(cur).surface; document.body.style.color = vars(cur).ink; }
  render("");
});
</script>
</body>
</html>
