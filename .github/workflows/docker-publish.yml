name: Build + push production images

# Every push to master builds the production images and pushes them to GHCR
# (private). Server C pulls them every 2 minutes — no source checkout and no
# git credentials on the server. See DEPLOYMENT.md "Registry deploy (server C)".
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE_PREFIX: ghcr.io/ghaith35/golden-wafer-group

permissions:
  contents: read
  packages: write

# The migrate image is pushed BEFORE the app image: the server's timer restarts
# the app as soon as the new app image appears, so its migration must already exist.
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
          tags: |
            ${{ env.IMAGE_PREFIX }}/migrate:latest
            ${{ env.IMAGE_PREFIX }}/migrate:${{ github.sha }}
      - name: Build + push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          tags: |
            ${{ env.IMAGE_PREFIX }}/app:latest
            ${{ env.IMAGE_PREFIX }}/app:${{ github.sha }}
